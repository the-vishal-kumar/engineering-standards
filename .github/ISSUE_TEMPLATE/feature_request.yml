name: Feature request
description: Propose a new capability or a change to existing behaviour.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what does it cost them today? Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: How will we know it worked? Name a metric or an observable behaviour if you can.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements. These feed the Definition of Ready.
      placeholder: |
        - Given ..., when ..., then ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing".
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
      description: Deadlines, other teams, compliance, cost.
